<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semdex 状态</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--surface:#fff;--text:#1a1d21;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--warn:#d97706;--err:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--surface:#1a1f26;--text:#e7eaee;--muted:#9aa3af;--border:#2a313b;--accent:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}.wrap{max-width:920px;margin:0 auto;padding:28px 20px 64px}header{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px}h1{margin:0;font-size:24px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.nav{margin-left:auto;display:flex;gap:12px;font-size:13px}.hero{padding:22px 0 14px}.hero p{margin:5px 0;color:var(--muted)}.progress{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}.line{display:flex;justify-content:space-between;gap:12px}.line span{color:var(--muted)}progress{width:100%;height:10px;margin:12px 0 5px;accent-color:var(--accent)}.current{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px}.panel h2{font-size:15px;margin:0 0 10px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{border-top:1px solid var(--border);padding-top:7px}.metric b{display:block;font-size:19px}.metric span{color:var(--muted);font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--border);border-radius:999px;padding:3px 9px;color:var(--muted);font-size:12px}.chip b{color:var(--text)}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:6px;padding:10px;max-height:260px;overflow:auto;color:var(--muted);font-size:12px}.error{color:var(--err)}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 48px}}
</style></head>
<body><main class="wrap"><header><h1>Semdex 状态</h1><nav class="nav"><a href="/">主页</a><a href="/settings">设置</a></nav></header>
<section class="hero"><h2>索引运行面板</h2><p>实时查看扫描、提取、向量化和可选实体抽取的当前阶段。</p></section>
<section class="progress"><div class="line"><strong id="phase">读取中</strong><strong id="percent">0%</strong></div><progress id="bar" max="100" value="0"></progress><div class="current" id="current"></div></section>
<div class="grid"><section class="panel"><h2>文件状态</h2><div class="metrics" id="files"></div></section><section class="panel"><h2>能力状态</h2><div class="chips" id="capabilities"></div></section><section class="panel"><h2>运行目录</h2><div class="chips" id="folders"></div></section><section class="panel"><h2>最近一次运行</h2><pre id="last">暂无</pre></section></div>
</main><script>
const $=s=>document.querySelector(s);const phaseLabels={idle:'空闲',preparing:'准备完整重建',scanning:'扫描目录',indexing:'提取与索引',embedding:'生成向量',entities:'抽取实体',complete:'本轮索引完成',failed:'本轮索引失败'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();const p=s.progress||{};$('#phase').textContent=phaseLabels[p.phase]||p.phase||'空闲';$('#percent').textContent=`${p.percent||0}%`;$('#bar').value=Number(p.percent||0);$('#current').textContent=p.current_file?`当前文件：${p.current_file}`:(s.indexing?'索引运行中':'');const by=s.files?.by_status||{};const labels={total:'文件总数',done:'已索引',pending:'待索引',waiting_model:'等待模型',waiting_capability:'等待本地能力',failed:'失败',skipped:'跳过',too_large:'超过大小限制'};$('#files').innerHTML=Object.entries({total:s.files?.total||0,...by}).map(([k,v])=>`<div class="metric"><b>${esc(v)}</b><span>${labels[k]||k}</span></div>`).join('');const m=s.models||{},c=s.capabilities||{};$('#capabilities').innerHTML=[['一级 LLM',`${m.llm_providers||0} 个启用`],['Python 插件',`${c.plugins||0} 个启用`],['RAG 语义',m.rag&&m.embedding?'已启用':'未启用'],['LLM 工具',m.agent?'已启用':'未启用'],['实体关系',m.entities?'已启用':'未启用']].map(([k,v])=>`<span class="chip">${k} <b>${v}</b></span>`).join('');$('#folders').innerHTML=(s.folders||[]).map(v=>`<span class="chip">${esc(v)}</span>`).join('')||'<span class="chip">未配置</span>';$('#last').textContent=s.last_run?JSON.stringify(s.last_run,null,2):'暂无';}catch(e){$('#phase').textContent='无法连接服务';$('#phase').className='error'}}refresh();setInterval(refresh,1000);
</script></body></html>
