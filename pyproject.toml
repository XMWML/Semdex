[project]
name = "semdex"
version = "0.3.0"
description = "本地文件语义索引系统——给现有文件系统建一层可搜索的影子索引"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "watchdog>=4.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
gui = ["PySide6-Essentials>=6.8"]

[project.scripts]
semdex = "semdex.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semdex"]

[tool.uv]
cache-dir = ".uv-cache"
