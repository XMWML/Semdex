[project]
name = "semdex"
version = "0.3.0"
description = "本地文件语义索引系统——给现有文件系统建一层可搜索的影子索引"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "watchdog>=4.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
gguf = ["llama-cpp-python>=0.3.34", "pywhispercpp>=1.5"]
mlx = [
    "mlx>=0.22; sys_platform == 'darwin'",
    "mlx-lm>=0.20; sys_platform == 'darwin'",
    "mlx-embeddings>=0.1; sys_platform == 'darwin'",
    "mlx-vlm>=0.6; sys_platform == 'darwin'",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
]
gui = ["PySide6-Essentials>=6.8"]

[project.scripts]
semdex = "semdex.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semdex"]

[tool.uv]
cache-dir = ".uv-cache"
